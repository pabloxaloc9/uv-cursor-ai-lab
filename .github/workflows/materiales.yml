name: Comprobar materiales del taller

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validar documentos y contratos
        run: python herramientas/validar_repo.py
      - name: Comprobar el verificador y los casos de referencia
        run: python -m unittest discover -s herramientas/tests -v
